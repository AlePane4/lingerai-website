name: Deploy to GitHub Pages

# Publishes two versions on one Pages site:
#   main  -> https://alepane4.github.io/lingerai-website/
#   edgy  -> https://alepane4.github.io/lingerai-website/edgy/
# Always runs from main; a push to edgy triggers this workflow via workflow_dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/checkout@v7
        with:
          ref: edgy
          path: edgy-src
      - run: npm ci
        working-directory: edgy-src
      - run: npm run build:pages
        working-directory: edgy-src
        env:
          PAGES_BASE: /lingerai-website/edgy
      - run: cp -r edgy-src/out out/edgy
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
