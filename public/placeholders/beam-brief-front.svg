<title id="beam-brief-front-title">BEAM, slip a vita alta: disegno tecnico, vista frontale</title>
<desc id="beam-brief-front-desc">Disegno a linee del capo in piano, senza corpo. Slip a vita alta: banda frontale in microfibra opaca dritta sopra l'ombelico, pannello centrale opaco, fianchi in mesh trasparente, elastico piatto in vita, tassello in cotone. Quote A (larghezza in vita), B (altezza davanti), C (altezza banda).</desc>
