<title id="raster-bralette-front-title">RASTER, bralette longline: disegno tecnico, vista frontale</title>
<desc id="raster-bralette-front-desc">Disegno a linee del capo in piano, senza corpo. Bralette longline in tulle trasparente con nastri piatti cuciti a griglia, in verticale e in orizzontale, fascia sottoseno alta, spalline fisse in nastro, senza chiusura. Quote A (larghezza fascia) e B (lunghezza davanti).</desc>
