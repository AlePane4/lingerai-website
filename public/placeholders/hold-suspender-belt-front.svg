<title id="hold-suspender-belt-front-title">HOLD, reggicalze: disegno tecnico, vista frontale</title>
<desc id="hold-suspender-belt-front-desc">Disegno a linee del capo in piano, senza corpo. Reggicalze a banda alta in microfibra opaca doppio strato, quattro nastri elastici regolabili con agganci per calze in metallo, chiusura posteriore a gancetti. Quote A (larghezza in vita), B (altezza banda), C (lunghezza nastro, min–max).</desc>
