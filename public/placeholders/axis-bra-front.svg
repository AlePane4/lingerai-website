<title id="axis-bra-front-title">AXIS, reggiseno a triangolo: disegno tecnico, vista frontale</title>
<desc id="axis-bra-front-desc">Disegno a linee del capo in piano, senza corpo. Due triangoli in mesh trasparente monostrato, ciascuno diviso da una cucitura verticale a vista, elastico sottoseno piatto, spalline regolabili con regolatore in metallo, chiusura posteriore a gancetti. Quote A (larghezza sottoseno) e B (altezza coppa).</desc>
