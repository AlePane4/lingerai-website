<title id="monolith-body-front-title">MONOLITH, body sgambato: disegno tecnico, vista frontale</title>
<desc id="monolith-body-front-desc">Disegno a linee del capo in piano, senza corpo. Body in microfibra opaca con scollo dritto, spalline sottili, sgambatura alta e tassello. Quote A (larghezza scollo), B (lunghezza davanti), C (altezza sgambatura).</desc>
