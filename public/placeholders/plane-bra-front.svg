<title id="plane-bra-front-title">PLANE, reggiseno balconette: disegno tecnico, vista frontale</title>
<desc id="plane-bra-front-desc">Disegno a linee del capo in piano, senza corpo. Coppe in mesh doppio strato con ferretto, scollo dritto, cucitura verticale a vista, spalline regolabili, fascia sotto il seno continua con chiusura posteriore a gancetti. Quote A (larghezza fascia) e B (altezza coppa).</desc>
