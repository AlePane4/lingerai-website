<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="tension-harness-front-title" aria-describedby="tension-harness-front-desc">
<title id="tension-harness-front-title">TENSION, harness: disegno tecnico, vista frontale</title>
<desc id="tension-harness-front-desc">Disegno a linee del capo in piano, senza corpo. Harness in elastico piatto opaco: due fasce dalle spalle che si uniscono in un anello in metallo al centro, una fascia verticale fino a un secondo anello sulla fascia sottoseno, regolatori sulle spalle, chiusura posteriore a gancio. Quote A (circonferenza sottoseno, min–max) e B (lunghezza fascia spalla).</desc>
