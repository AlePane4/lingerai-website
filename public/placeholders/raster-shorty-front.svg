<title id="raster-shorty-front-title">RASTER, culotte: disegno tecnico, vista frontale</title>
<desc id="raster-shorty-front-desc">Disegno a linee del capo in piano, senza corpo. Culotte in tulle trasparente con nastri piatti cuciti a griglia, vita media con elastico piatto, gamba dritta, tassello in cotone opaco. Quote A (larghezza in vita), B (altezza davanti), C (lunghezza gamba laterale).</desc>
