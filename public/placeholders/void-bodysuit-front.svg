<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="void-bodysuit-front-title" aria-describedby="void-bodysuit-front-desc">
<title id="void-bodysuit-front-title">VOID, body a manica lunga: disegno tecnico, vista frontale</title>
<desc id="void-bodysuit-front-desc">Disegno a linee del capo in piano, senza corpo. Body in mesh trasparente monostrato con collo alto e maniche lunghe fino al polso, cuciture piatte a vista lungo le braccia e il busto, tassello opaco con chiusura a gancetti sul cavallo. Quote A (larghezza spalle), B (lunghezza davanti), C (lunghezza manica).</desc>
