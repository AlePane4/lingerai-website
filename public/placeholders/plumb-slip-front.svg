<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="plumb-slip-front-title" aria-describedby="plumb-slip-front-desc">
<title id="plumb-slip-front-title">PLUMB, sottoveste: disegno tecnico, vista frontale</title>
<desc id="plumb-slip-front-desc">Disegno a linee del capo in piano, senza corpo. Sottoveste in jersey di seta opaco, scollo dritto con leggera punta al centro, spalline sottili regolabili, taglio dritto senza pinces che cade a piombo, orlo a metà coscia rifinito. Quote A (larghezza al seno) e B (lunghezza totale).</desc>
