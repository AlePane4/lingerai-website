<title id="strut-bra-front-title">STRUT, reggiseno senza ferretto: disegno tecnico, vista frontale</title>
<desc id="strut-bra-front-desc">Disegno a linee del capo in piano, senza corpo. Coppe morbide in microfibra opaca doppio strato, senza imbottitura, spalline sottili che si incrociano sul retro (qui stese in piano), fascia sottoseno con chiusura posteriore a gancetti. Quote A (larghezza sottoseno) e B (altezza coppa).</desc>
